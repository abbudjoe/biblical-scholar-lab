[project]
name = "bsl"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["pydantic==2.13.4", "rfc8785==0.1.4", "uuid6==2025.0.1"]
[project.scripts]
bsl = "bsl.interfaces.cli:main"
[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"
[dependency-groups]
dev = ["hypothesis==6.165.10", "pyright==1.1.411", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
[tool.ruff]
extend-exclude = ["governance"]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
