name: Governance integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request-evidence:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [project-integrity, turn-handoff-integrity]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run defense-in-depth check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          CHECK_NAME: ${{ matrix.check }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 -m py_compile governance/w00_contracts.py governance/w00_checks.py
          if [ "$CHECK_NAME" = project-integrity ]; then
            python3 -m unittest -v governance/test_w00_checks.py
            python3 governance/w00_checks.py project-integrity --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --branch "$BRANCH_NAME"
          else
            python3 governance/w00_checks.py turn-handoff-integrity --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --branch "$BRANCH_NAME" --pr-url "$PR_URL"
          fi

  postmerge-static:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - run: python3 -m unittest -v governance/test_w00_checks.py
