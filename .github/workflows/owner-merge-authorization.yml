name: owner-merge-authorization

on:
  workflow_dispatch:
    inputs:
      pr_number: {required: true, type: number}
      authorized_head_sha: {required: true, type: string}
      chatgpt_review_id: {required: true, type: string}
      trusted_run_id: {required: true, type: number}

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: owner-merge-authorization
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download trusted receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          gh run download "$TRUSTED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "trusted-governance-receipt-$TRUSTED_RUN_ID" --dir "$RUNNER_TEMP/trusted"
      - name: Query exact live evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.authorized_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/comments.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRUSTED_RUN_ID" > "$RUNNER_TEMP/trusted-run.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          gh api graphql -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" > "$RUNNER_TEMP/conversations.json"
      - name: Emit owner authorization receipt without merging
        env:
          HEAD_SHA: ${{ inputs.authorized_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ inputs.chatgpt_review_id }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
        run: >-
          python3 governance/w00_checks.py owner-authorize --pr-number "$PR_NUMBER"
          --authorized-head-sha "$HEAD_SHA" --chatgpt-review-id "$REVIEW_ID"
          --trusted-run-id "$TRUSTED_RUN_ID" --workflow-ref "$GITHUB_REF"
          --workflow-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --pr-json "$RUNNER_TEMP/pr.json" --comments-json "$RUNNER_TEMP/comments.json"
          --trusted-receipt "$RUNNER_TEMP/trusted/trusted-governance-receipt.json"
          --trusted-run-json "$RUNNER_TEMP/trusted-run.json" --checks-json "$RUNNER_TEMP/checks.json"
          --conversations-json "$RUNNER_TEMP/conversations.json"
          --output "$RUNNER_TEMP/owner-merge-authorization-receipt.json"
      - name: Publish immutable owner-authorization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-merge-authorization-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/owner-merge-authorization-receipt.json
          if-no-files-found: error
          retention-days: 90
