name: vs01-t05-ci
on: {pull_request: {branches: [main]}}
permissions: {contents: read}
jobs:
  vs01-t05-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env: {POSTGRES_USER: bsl_test, POSTGRES_PASSWORD: bsl_test, POSTGRES_DB: bsl_test}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bsl_test -d bsl_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BSL_TEST_DATABASE_URL: postgresql://bsl_test:bsl_test@localhost:5432/bsl_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
      - run: uv sync --frozen
      - name: PostgreSQL 18.6 identity
        run: test "$(psql "$BSL_TEST_DATABASE_URL" -Atc 'SHOW server_version_num')" = "180006"
      - name: PostgreSQL runtime tests with zero skips
        run: uv run pytest tests/test_runtime_postgres.py -rs
      - name: Migration and schema conformance
        run: uv run pytest tests/test_runtime_postgres.py::test_migration_has_exact_catalog_boundary
      - name: Exact head and committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
