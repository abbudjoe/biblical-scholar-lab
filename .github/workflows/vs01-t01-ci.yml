name: vs01-t01-ci
on: {pull_request: {branches: [main]}}
permissions: {contents: read}
jobs:
  vs01-t01-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check uv==0.11.7
      - run: uv sync --frozen
      - name: Schema drift
        run: uv run pytest tests/test_cli_and_schemas.py::test_schema_generation_has_no_drift_and_registry_hashes_match
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Tests and branch coverage
        run: uv run pytest --cov=bsl --cov-branch --cov-report=term-missing --cov-fail-under=90
      - name: Exact head and committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
