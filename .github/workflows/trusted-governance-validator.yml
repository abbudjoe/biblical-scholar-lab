name: trusted-governance-validator

on: # zizmor: ignore[dangerous-triggers] -- trusted base executes; candidate remains inert data
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-governance-integrity:
    name: trusted-governance-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate as inert Git objects
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --filter=blob:limit=524289 --depth=16 origin "pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
      - name: Validate inert candidate with trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          GIT_NO_LAZY_FETCH: "1"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 governance/w00_checks.py trusted-governance
          --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER"
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --trusted-revision "$BASE_SHA"
          --branch "$BRANCH_NAME" --event "$GITHUB_EVENT_NAME"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/trusted-governance-receipt.json"
      - name: Publish immutable trusted-validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-governance-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted-governance-receipt.json
          if-no-files-found: error
          retention-days: 90
